name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  JJ_VERSION: "0.46.0"
  JJ_USER: "CI"
  JJ_EMAIL: "ci@example.com"

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        neovim: ["v0.12.0", "stable"]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Neovim ${{ matrix.neovim }}
        run: |
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${{ matrix.neovim }}/nvim-linux-x86_64.tar.gz"
          mkdir -p "$HOME/nvim"
          tar -xzf nvim.tar.gz -C "$HOME/nvim" --strip-components=1
          echo "$HOME/nvim/bin" >> "$GITHUB_PATH"

      - name: Install jj ${{ env.JJ_VERSION }}
        run: |
          curl -fsSL -o jj.tar.gz "https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/jj"
          tar -xzf jj.tar.gz -C "$HOME/jj"
          echo "$HOME/jj" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          nvim --version | head -n 1
          jj --version

      - name: Run tests
        run: nvim --headless --noplugin -u tests/minimal_init.lua -c "lua MiniTest.run()"
